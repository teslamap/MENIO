<!doctype html><html lang="ka"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ORDERA — პარამეტრების დემო</title><link rel="stylesheet" href="style.css?v=20261014-ordera-brand-1"><link rel="stylesheet" href="restaurant-settings.css?v=20261015-1"><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin="" defer></script></head><body><main class="wrap"><a class="logo" href="index.html">ORDERA.</a><h1>რესტორნის პარამეტრები</h1><p>დიზაინის დემო — შენახვა რეალურ რესტორანს არ ცვლის.</p><button id="settingsNavLink" type="button">პარამეტრების გახსნა ⚙</button></main><dialog id="restaurantSettingsDialog" class="restaurant-settings" aria-labelledby="restaurantSettingsTitle"><section class="restaurant-settings-inner"><div class="settings-head"><div><p class="eyebrow">რესტორნის პარამეტრები</p><h2 id="restaurantSettingsTitle">შენი რესტორნი</h2></div><button id="closeRestaurantSettings" type="button" class="secondary small-button" aria-label="პარამეტრების დახურვა">✕</button></div><h3>რესტორნის ლოკაცია</h3><p>მონიშნე რესტორნის შესასვლელი რუკაზე. შენახული წერტილი კურიერს შეკვეთის აღების ადგილს აჩვენებს.</p><div id="restaurantLocationMap" aria-label="რესტორნის ლოკაციის არჩევის რუკა"></div><form id="restaurantLocationForm"><label for="restaurantAddress">მისამართი / შესასვლელის აღწერა</label><input id="restaurantAddress" maxlength="300" placeholder="მაგ. ქუჩა, ნომერი, შესასვლელი"><div class="location-fields"><label for="restaurantLatitude">განედი<input id="restaurantLatitude" type="number" min="-90" max="90" step="any" required></label><label for="restaurantLongitude">გრძედი<input id="restaurantLongitude" type="number" min="-180" max="180" step="any" required></label></div><div class="location-actions"><button id="locateRestaurant" type="button" class="secondary">⌖ ჩემი მდებარეობა</button><button id="saveRestaurantLocation" type="submit" disabled>საცდელი შენახვა</button></div><p id="restaurantLocationMessage" role="status" aria-live="polite"></p></form></section></dialog><script type="module">import {coordinates} from "./courier-map.js?v=20261015-navigation-3";const auth={currentUser:{uid:"demo"}},db={};const doc=()=>null;const updateDoc=async()=>{};function mountRestaurantSettings(slug,restaurant){
 const $=id=>document.getElementById(id),dialog=$('restaurantSettingsDialog');if(!dialog)return;
 let map,marker,savedLocation=coordinates(restaurant.restaurantLocation),savedAddress=restaurant.restaurantAddress||'',saving=false,locationRequest=0;
 const message=text=>{$('restaurantLocationMessage').textContent=text;};
 function pick(point,center=false,writeInputs=true){if(writeInputs){$('restaurantLatitude').value=point[0].toFixed(6);$('restaurantLongitude').value=point[1].toFixed(6);}if(map){if(marker)marker.setLatLng(point);else marker=window.L.marker(point,{draggable:true,title:'რესტორნის შესასვლელი'}).addTo(map).on('dragend',()=>{const p=marker.getLatLng();pick([p.lat,p.lng]);});if(center)map.setView(point,16);}$('saveRestaurantLocation').disabled=false;}
 function inputPoint(){const lat=$('restaurantLatitude').value.trim(),lng=$('restaurantLongitude').value.trim();return lat&&lng?coordinates({latitude:Number(lat),longitude:Number(lng)}):null;}
 $('settingsNavLink').onclick=e=>{e.preventDefault();$('restaurantAddress').value=savedAddress;$('restaurantLatitude').value='';$('restaurantLongitude').value='';$('saveRestaurantLocation').disabled=!savedLocation;message(savedLocation?'შენახული ლოკაცია. წერტილის შესაცვლელად დააჭირე რუკას ან გადაადგილე მარკერი.':'დააჭირე რუკაზე რესტორნის შესასვლელს.');dialog.showModal();if(!map&&window.L){map=window.L.map('restaurantLocationMap').setView(savedLocation||[41.7151,44.8271],savedLocation?16:13);window.L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'}).addTo(map).on('tileerror',()=>message('რუკის ჩატვირთვა ვერ მოხერხდა. კოორდინატების მითითება ხელითაც შეგიძლია.'));map.on('click',e=>{pick([e.latlng.lat,e.latlng.lng]);message('ლოკაცია არჩეულია. დააჭირე შენახვას.');});}if(!window.L)message('რუკა ვერ ჩაიტვირთა. შეიყვანე კოორდინატები ხელით ან განაახლე გვერდი.');if(marker){marker.remove();marker=null;}if(savedLocation)pick(savedLocation,true);requestAnimationFrame(()=>map?.invalidateSize());};
 $('closeRestaurantSettings').onclick=()=>{if(!saving)dialog.close();};
 dialog.addEventListener('close',()=>{locationRequest++;$('locateRestaurant').disabled=false;});
 for(const id of ['restaurantLatitude','restaurantLongitude'])$(id).oninput=()=>{const point=inputPoint();$('saveRestaurantLocation').disabled=!point;if(point)pick(point,false,false);};
 $('locateRestaurant').onclick=()=>{if(!navigator.geolocation){message('მდებარეობის დადგენა მიუწვდომელია. აირჩიე წერტილი რუკაზე.');return;}const request=++locationRequest;$('locateRestaurant').disabled=true;message('მდებარეობას ვადგენ…');navigator.geolocation.getCurrentPosition(p=>{if(request!==locationRequest)return;pick([p.coords.latitude,p.coords.longitude],true);message('გადაამოწმე მარკერი: ის ზუსტად რესტორნის შესასვლელზე უნდა იყოს.');$('locateRestaurant').disabled=false;},()=>{if(request!==locationRequest)return;message('მდებარეობა ვერ განისაზღვრა. აირჩიე წერტილი რუკაზე.');$('locateRestaurant').disabled=false;},{enableHighAccuracy:true,timeout:12000,maximumAge:0});};
 $('restaurantLocationForm').onsubmit=async e=>{e.preventDefault();const point=inputPoint();if(saving)return;if(!point){message('აირჩიე სწორი ლოკაცია.');return;}if(!auth.currentUser){message('ანგარიშში შესვლა საჭიროა.');return;}saving=true;$('saveRestaurantLocation').disabled=true;message('ინახება…');const address=$('restaurantAddress').value.trim();try{await updateDoc(doc(db,'restaurants',slug),{restaurantLocation:{latitude:point[0],longitude:point[1]},restaurantAddress:address});savedLocation=point;savedAddress=address;message('ლოკაცია შენახულია. კურიერის რუკაზე რესტორნის წერტილად გამოჩნდება.');}catch(error){message(error.code==='permission-denied'?'შენახვის უფლება ვერ დადასტურდა. შეამოწმე ანგარიში და გამოქვეყნებული წესები.':'შენახვა ვერ მოხერხდა. სცადე ხელახლა.');}finally{saving=false;$('saveRestaurantLocation').disabled=false;}};
 window.addEventListener('pagehide',()=>{locationRequest++;map?.remove();},{once:true});
}

mountRestaurantSettings("demo",{name:"დემო რესტორანი"});document.getElementById("settingsNavLink").click();document.getElementById("restaurantLocationMessage").textContent="დემო: აირჩიე წერტილი. ცვლილებები რეალურ რესტორანში არ ინახება.";</script></body></html>
