<!doctype html>
<html lang="ka">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MENIO Partner — სატესტო მერჩანტი</title>
<link rel="stylesheet" href="style.css?v=20261014-merchant-landscape-1">
<style>
:root{--accent-color:#ed683d;--line:#ecebe6;--ink:#22221d;--muted:#77766f}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#fff!important;color:var(--ink);font-family:Inter,system-ui,-apple-system,"Segoe UI","Noto Sans Georgian",sans-serif}
.demo-shell{height:100dvh;min-height:0;padding:14px 18px;display:flex;flex-direction:column;gap:12px}
.demo-topbar{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:18px;padding-bottom:12px;border-bottom:1px solid #ecebe7}
.brand{font-size:23px;font-weight:900;letter-spacing:-1.4px;text-decoration:none;color:#20201c}.brand span{color:#ed683d}
.live{display:flex;align-items:center;justify-content:center;gap:9px;color:#66655e;font-size:12px;font-weight:750}.live-dot{width:8px;height:8px;border-radius:50%;background:#22a66a;box-shadow:0 0 0 4px #22a66a19}
.top-actions{display:flex;align-items:center;gap:8px}.top-actions button{padding:9px 12px;border-radius:10px;font-size:11px}
.demo-heading{display:flex;align-items:center;justify-content:space-between;gap:14px;flex:0 0 auto}.kicker{font-size:9px;letter-spacing:1.7px;font-weight:850;color:#e75f35;margin:0 0 3px}.demo-heading h1{font-size:clamp(22px,2.2vw,30px);letter-spacing:-.7px;line-height:1.2;margin:0}.subline{font-size:11px;color:#77766f;margin:5px 0 0}.heading-actions{display:flex;align-items:center;gap:8px}.demo-pill{padding:8px 11px;background:#f8f7f4;border:1px solid #eeece6;border-radius:10px;color:#626159;font-size:10px;font-weight:700;white-space:nowrap}
.board{flex:1 1 auto;min-height:0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.lane{display:flex;flex-direction:column;min-height:0;min-width:0;overflow:hidden;background:#f8f8f6;border:1px solid #ecebe7;border-radius:16px;padding:10px}
.lane-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:5px 5px 11px;flex:0 0 auto}.lane-title{display:flex;align-items:center;gap:9px;font-size:14px;font-weight:850}.dot{width:8px;height:8px;border-radius:50%;background:#e7a23c;box-shadow:0 0 0 4px #e7a23c18}.preparing .dot{background:#ed683d;box-shadow:0 0 0 4px #ed683d18}.ready .dot{background:#2ba66c;box-shadow:0 0 0 4px #2ba66c18}
.count{min-width:27px;padding:4px 8px;text-align:center;background:#fff;border:1px solid #eeece6;border-radius:999px;font-size:11px;font-weight:850;color:#4a4942}
.cards{flex:1 1 auto;min-height:0;overflow-y:auto;display:grid;align-content:start;gap:9px;padding:0 2px 2px 0;scrollbar-width:thin;scrollbar-color:#d7d5ce transparent}
.order{background:#fff;border:1px solid #e9e7e1;border-radius:13px;padding:12px;box-shadow:0 2px 8px #27241b06;min-width:0}
.order-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}.table{font-size:15px;font-weight:900;letter-spacing:-.2px}.status{padding:5px 7px;border-radius:7px;font-size:9px;font-weight:850;white-space:nowrap;background:#fff0e5;color:#b9512b}.preparing .status{background:#fff0e5;color:#b9512b}.ready .status{background:#e8f7ee;color:#23784b}
.order-ref{display:flex;justify-content:space-between;gap:8px;margin:-1px 0 7px;color:#8b887e;font-size:9px}
.items{display:grid;gap:0}.item{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;padding:6px 0;border-bottom:1px solid #f0eee9;font-size:11px;line-height:1.4}.item span{min-width:0;overflow-wrap:anywhere}.item b{font-size:10px;white-space:nowrap}
.total{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0 5px;font-size:11px;color:#66645c}.total strong{font-size:16px;color:#24231f}
.note{padding:8px 9px;margin:6px 0 0;border-radius:8px;background:#f7f5f0;color:#69665d;font-size:10px;line-height:1.45;overflow-wrap:anywhere}
.payline{display:flex;justify-content:space-between;gap:8px;margin-top:8px;padding-top:7px;border-top:1px solid #f0eee9;color:#77746a;font-size:9px}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:10px}.actions button{min-width:0;padding:8px 7px;font-size:10px;line-height:1.3;border-radius:8px}.actions button:first-child:last-child{grid-column:1/-1}.actions .secondary{background:#fff;color:#56544c;border:1px solid #e7e4dc}.empty{padding:24px 10px;text-align:center;color:#99968c;border:1px dashed #e3e0d8;background:#fff;border-radius:12px;font-size:11px}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#20201c;color:#fff;padding:10px 15px;border-radius:11px;font-size:12px;box-shadow:0 10px 30px #0002;z-index:10}
@media(orientation:portrait){body:after{content:"მერჩანტის სამუშაოდ გადააბრუნე მოწყობილობა ჰორიზონტალურად ↻";position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;text-align:center;padding:30px;background:#fff;color:#25241f;font-size:20px;font-weight:800;line-height:1.6}}
@media(max-height:520px) and (orientation:landscape){.demo-shell{padding:8px 12px;gap:7px}.demo-topbar{padding-bottom:7px}.lane{padding:7px}.order{padding:9px}.actions button{padding:6px}}
</style>
</head>
<body>
<main class="demo-shell">
<header class="demo-topbar">
<a class="brand" href="../index.html">MENIO<span>.</span></a>
<div class="live"><span class="live-dot"></span><span>Delicate · სატესტო მერჩანტი</span><span class="demo-pill">LIVE DEMO</span></div>
<div class="top-actions"><button id="addOrder">＋ სატესტო შეკვეთა</button><a class="btn secondary" href="merchant.html?restaurant=delicate">რეალურ მერჩანტზე ↗</a></div>
</header>
<section class="demo-heading">
<div><p class="kicker">MENIO PARTNER · ORDER MANAGEMENT</p><h1>შეკვეთების დაფა</h1><p class="subline" id="summary">სატესტო რეჟიმი · შეკვეთები ამ გვერდზე იმიტირებულია</p></div>
<div class="heading-actions"><span class="demo-pill">თეთრი სამუშაო სივრცე</span><span class="demo-pill">3 სტატუსის სვეტი</span></div>
</section>
<section class="board" aria-label="შეკვეთების სტატუსები">
<div class="lane incoming"><div class="lane-head"><div class="lane-title"><span class="dot"></span>შემოსული</div><span class="count" id="count-incoming">0</span></div><div class="cards" id="cards-incoming"></div></div>
<div class="lane preparing"><div class="lane-head"><div class="lane-title"><span class="dot"></span>მზადდება</div><span class="count" id="count-preparing">0</span></div><div class="cards" id="cards-preparing"></div></div>
<div class="lane ready"><div class="lane-head"><div class="lane-title"><span class="dot"></span>მზადაა</div><span class="count" id="count-ready">0</span></div><div class="cards" id="cards-ready"></div></div>
</section>
</main>
<script>
const data=[
{id:"M-1048",table:4,status:"incoming",time:"14:32",items:[["ჩიზბურგერი × 2",26],["კარტოფილი ფრი × 1",7],["კოლა × 2",8]],total:41,note:"ერთი ბურგერი სოუსის გარეშე",paid:false},
{id:"M-1047",table:2,status:"incoming",time:"14:29",items:[["აჭარული ხაჭაპური × 1",18],["ლიმონათი × 1",5]],total:23,note:"",paid:true},
{id:"M-1046",table:7,status:"preparing",time:"14:24",items:[["პეპერონი პიცა × 1",24],["ცეზარის სალათი × 1",16]],total:40,note:"პიცა კარგად გამომცხვარი",paid:false},
{id:"M-1045",table:1,status:"ready",time:"14:17",items:[["ქათმის ბურგერი × 1",15],["წყალი × 2",4]],total:19,note:"შეკვეთა მზადაა — გაიტანე მაგიდასთან",paid:true}
];
const lanes={incoming:{title:"შემოსული",empty:"ახალი შეკვეთები აქ გამოჩნდება"},preparing:{title:"მზადდება",empty:"მომზადებაში შეკვეთა არ არის"},ready:{title:"მზადაა",empty:"მზად შეკვეთები აქ გამოჩნდება"}};
const money=n=>Number(n).toFixed(2)+" ₾";
function node(tag,cls,txt){const n=document.createElement(tag);if(cls)n.className=cls;if(txt!==undefined)n.textContent=txt;return n}
function button(text,cls,fn){const b=node("button",cls,text);b.onclick=fn;return b}
function renderCard(o){
 const card=node("article","order"),head=node("div","order-head");
 head.append(node("span","table","მაგიდა №"+o.table),node("span","status",lanes[o.status].title));card.append(head);
 card.append(node("div","order-ref",o.id+" · "+o.time));
 const items=node("div","items");o.items.forEach(([name,price])=>{const row=node("div","item");row.append(node("span","",name),node("b","",money(price)));items.append(row)});card.append(items);
 const total=node("div","total");total.append(node("span","","ჯამი"),node("strong","",money(o.total)));card.append(total);
 if(o.note)card.append(node("p","note","შენიშვნა: "+o.note));
 const pay=node("div","payline");pay.append(node("span","","გადახდა"),node("strong","",o.paid?"გადახდილია":"მოლოდინში"));card.append(pay);
 const actions=node("div","actions");
 if(o.status==="incoming")actions.append(button("მომზადების დაწყება","",()=>{o.status="preparing";render();toast("შეკვეთა გადავიდა „მზადდება“ სვეტში")}));
 if(o.status==="preparing")actions.append(button("✓ მზადაა","",()=>{o.status="ready";render();toast("შეკვეთა მზადაა")}));
 if(!o.paid)actions.append(button("გადახდილია","secondary",()=>{o.paid=true;render();toast("გადახდა მონიშნულია")}));
 if(o.status==="ready"&&o.paid)actions.append(button("დაფიდან მოცილება","secondary",()=>{const i=data.findIndex(x=>x.id===o.id);if(i>=0)data.splice(i,1);render();toast("სატესტო შეკვეთა დაფიდან მოიხსნა")}));
 if(actions.childElementCount)card.append(actions);
 return card;
}
function render(){for(const key of Object.keys(lanes)){const root=document.getElementById("cards-"+key),list=data.filter(o=>o.status===key);root.replaceChildren();document.getElementById("count-"+key).textContent=list.length;if(!list.length)root.append(node("div","empty",lanes[key].empty));else list.forEach(o=>root.append(renderCard(o)))}document.getElementById("summary").textContent="სულ აქტიური შეკვეთები: "+data.length+" · სატესტო რეჟიმი — ცვლილებები მხოლოდ ამ გვერდზე ინახება"}
function toast(message){const old=document.querySelector(".toast");old?.remove();const t=node("div","toast",message);t.role="status";document.body.append(t);setTimeout(()=>t.remove(),1800)}
document.getElementById("addOrder").onclick=()=>{const next=1049+data.length;data.unshift({id:"M-"+next,table:((next-1)%8)+1,status:"incoming",time:new Date().toLocaleTimeString("ka-GE",{hour:"2-digit",minute:"2-digit"}),items:[["სატესტო ბურგერი × 1",14],["გამაგრილებელი სასმელი × 1",4]],total:18,note:"ახალი სატესტო შეკვეთა",paid:false});render();toast("ახალი სატესტო შეკვეთა დაემატა")};
render();
</script>
</body>
</html>
