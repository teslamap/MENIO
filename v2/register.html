<!doctype html>
<html lang="ka"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MENIO — რესტორნის რეგისტრაცია და შესვლა</title><link rel="stylesheet" href="style.css"></head><body><main class="panel"><a class="back" href="index.html">← მთავარ გვერდზე</a><div class="logo">MENIO<span>.</span></div><h1 class="auth-title">შენი რესტორანი იწყება აქ.</h1><p>შექმენი ანგარიში და მართე მენიუ, კატეგორიები და მაგიდები.</p><form id="registerForm"><label for="restaurantName">რესტორნის სახელი</label><input id="restaurantName" required maxlength="120" placeholder="რესტორნის სახელი" autocomplete="organization"><label for="restaurantSlug">უნიკალური ბმული (ლათინურად)</label><input id="restaurantSlug" pattern="[a-z0-9-]{3,40}" maxlength="40" required placeholder="my-restaurant"><small>3–40 პატარა ლათინური ასო, ციფრი ან დეფისი.</small><label for="email">ელფოსტა</label><input id="email" type="email" required autocomplete="email" placeholder="you@example.com"><label for="password">პაროლი (მინ. 8 სიმბოლო)</label><input id="password" type="password" minlength="8" required autocomplete="new-password"><label for="tableCount">მაგიდების საწყისი რაოდენობა</label><input id="tableCount" type="number" min="1" max="200" value="10" required><button id="registerButton">რესტორნის შექმნა</button></form><div class="divider"></div><h2 id="login">უკვე გაქვს ანგარიში?</h2><form id="loginForm"><label for="loginEmail">ელფოსტა</label><input id="loginEmail" type="email" required autocomplete="username"><label for="loginPassword">პაროლი</label><input id="loginPassword" type="password" required autocomplete="current-password"><button id="loginButton" class="secondary">შესვლა</button></form><p id="message" class="message" role="status" aria-live="polite"></p><div id="restaurantChoices" class="actions" hidden></div></main><script type="module" src="app.js"></script></body></html>
