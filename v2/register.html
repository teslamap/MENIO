<!doctype html>
<html lang="ka">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#101116">
  <title>MENIO — შესვლა</title>
  <link rel="stylesheet" href="style.css?v=20261014-login-focus-1">
  <style>
    .login-panel{max-width:460px;margin:clamp(24px,8vh,88px) auto;padding:clamp(24px,5vw,42px)}
    .login-panel .logo{display:inline-block;margin-bottom:24px}
    .login-panel .auth-title{font-size:clamp(30px,6vw,40px);margin:10px 0}
    .login-subtitle{margin:0 0 26px}
    .login-form{gap:12px}
    .login-form button{width:100%;margin-top:8px;min-height:48px}
    .login-foot{border-top:1px solid #ffffff18;margin-top:26px;padding-top:20px;text-align:center}
    .text-link{border:0;background:none;color:var(--accent-color,#d7ff64);padding:4px;font-weight:750;text-decoration:underline;text-underline-offset:4px;cursor:pointer}
    .login-panel .message{margin-top:18px}
    .register-dialog{width:min(560px,calc(100% - 28px));max-height:min(88dvh,820px);overflow:auto;padding:0;border:1px solid #ffffff24;border-radius:24px;background:#171920;color:#f5f5f7;box-shadow:0 24px 90px #0009}
    .register-dialog::backdrop{background:#05060acc;backdrop-filter:blur(5px)}
    .dialog-inner{padding:clamp(22px,5vw,36px)}
    .dialog-head{display:flex;justify-content:space-between;align-items:flex-start;gap:18px}
    .dialog-head h2{margin:8px 0;font-size:27px}
    .close-dialog{width:40px;height:40px;padding:0;flex:0 0 40px;background:#292c35;color:#fff;font-size:24px}
    .register-dialog form{margin-top:22px}
    .register-dialog .dialog-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:8px}
    .register-dialog .dialog-actions button{flex:1}
    @media(max-width:560px){.login-panel{margin:18px auto}.register-dialog{border-radius:20px}}
  </style>
</head>
<body>
  <main class="panel login-panel">
    <a class="back" href="index.html">← მთავარ გვერდზე</a>
    <div><a class="logo" href="index.html">MENIO<span>.</span></a></div>
    <p class="eyebrow">რესტორნის მართვის პანელი</p>
    <h1 class="auth-title">კეთილი დაბრუნება.</h1>
    <p class="login-subtitle">შედი ანგარიშში და გააგრძელე შენი რესტორნის მართვა.</p>

    <form id="loginForm" class="login-form">
      <label for="loginEmail">ელფოსტა</label>
      <input id="loginEmail" type="email" required autocomplete="username" placeholder="you@example.com">
      <label for="loginPassword">პაროლი</label>
      <input id="loginPassword" type="password" required autocomplete="current-password" placeholder="შეიყვანე პაროლი">
      <button id="loginButton" type="submit">შესვლა <span aria-hidden="true">→</span></button>
    </form>
    <p id="message" class="message" role="status" aria-live="polite"></p>
    <div id="restaurantChoices" class="actions" hidden></div>
    <div class="login-foot">
      <p style="margin:0 0 8px">პირველად იყენებ MENIO-ს?</p>
      <button id="openRegister" class="text-link" type="button">რესტორნის რეგისტრაცია</button>
    </div>
  </main>

  <dialog id="registerDialog" class="register-dialog" aria-labelledby="registerTitle">
    <div class="dialog-inner">
      <div class="dialog-head">
        <div>
          <div class="logo">MENIO<span>.</span></div>
          <h2 id="registerTitle">დაარეგისტრირე რესტორანი</h2>
          <p style="margin:0">შექმენი ანგარიში და მოამზადე მენიუ ონლაინ შეკვეთებისთვის.</p>
        </div>
        <button id="closeRegister" class="close-dialog" type="button" aria-label="დახურვა">×</button>
      </div>
      <form id="registerForm">
        <label for="restaurantName">რესტორნის სახელი</label>
        <input id="restaurantName" required maxlength="120" placeholder="მაგ. Delicate" autocomplete="organization">
        <label for="restaurantSlug">უნიკალური ბმული (ლათინურად)</label>
        <input id="restaurantSlug" pattern="[a-z0-9-]{3,40}" maxlength="40" required placeholder="delicate">
        <small>3–40 პატარა ლათინური ასო, ციფრი ან დეფისი.</small>
        <label for="email">ელფოსტა</label>
        <input id="email" type="email" required autocomplete="email" placeholder="you@example.com">
        <label for="password">პაროლი (მინ. 8 სიმბოლო)</label>
        <input id="password" type="password" minlength="8" required autocomplete="new-password">
        <label for="tableCount">მაგიდების საწყისი რაოდენობა</label>
        <input id="tableCount" type="number" min="1" max="200" value="10" required>
        <div class="dialog-actions">
          <button id="registerButton" type="submit">რესტორნის შექმნა</button>
          <button id="cancelRegister" class="secondary" type="button">გაუქმება</button>
        </div>
      </form>
    </div>
  </dialog>

  <script>
    const registerDialog=document.getElementById("registerDialog");
    document.getElementById("openRegister").addEventListener("click",()=>registerDialog.showModal());
    document.getElementById("closeRegister").addEventListener("click",()=>registerDialog.close());
    document.getElementById("cancelRegister").addEventListener("click",()=>registerDialog.close());
    registerDialog.addEventListener("click",event=>{if(event.target===registerDialog)registerDialog.close();});
  </script>
  <script type="module" src="app.js?v=20261014-login-focus-1"></script>
</body>
</html>
