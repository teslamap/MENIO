<!doctype html>
<html lang="ka">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MENIO Partner — შეკვეთები</title>
<link rel="stylesheet" href="style.css?v=20261014-merchant-landscape-1">
<style>
.merchant-page{width:min(1600px,96%);margin:22px auto 60px}
.merchant-title{display:flex;align-items:flex-end;justify-content:space-between;gap:18px;flex-wrap:wrap;margin:24px 0}
.merchant-title h1{font-size:clamp(30px,4vw,44px);margin:6px 0}
.board-summary{display:flex;gap:10px;flex-wrap:wrap}
.summary-chip{background:#fff;border:1px solid var(--line);border-radius:999px;padding:9px 13px;font-size:13px;color:var(--ink)}
.order-board{display:grid;grid-template-columns:repeat(3,minmax(280px,1fr));gap:16px;align-items:start;overflow-x:auto;padding:4px 2px 18px}
.order-lane{min-width:0;background:#f0eee8;border:1px solid #e6e2d8;border-radius:20px;padding:13px;min-height:260px}
.lane-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 7px 15px}
.lane-title{display:flex;align-items:center;gap:10px;font-size:17px;font-weight:850;color:#25241f}
.lane-dot{width:10px;height:10px;border-radius:50%;background:#e7a23c;box-shadow:0 0 0 4px #e7a23c20}
.lane-preparing .lane-dot{background:#ed683d;box-shadow:0 0 0 4px #ed683d20}
.lane-ready .lane-dot{background:#379563;box-shadow:0 0 0 4px #37956320}
.lane-count{min-width:30px;text-align:center;border-radius:999px;padding:5px 9px;background:#fff;color:#55534c;font-size:12px;font-weight:800}
.lane-cards{display:grid;gap:12px}
.board-empty{padding:28px 12px;text-align:center;color:#8b887e;border:1px dashed #d6d1c5;border-radius:15px;background:#ffffff70;font-size:13px}
.order-card{margin:0!important;padding:16px!important;background:#fff!important;border:1px solid #e8e4da!important;border-radius:16px!important;box-shadow:0 6px 18px #25211608!important;color:#25241f!important}
.order-head{align-items:flex-start;margin-bottom:13px}
.order-head h2{font-size:17px;line-height:1.4;color:#25241f}
.order-card .status{font-size:11px;white-space:nowrap}
.order-card .order-item{font-size:13px;color:#4f4d46;border-color:#f0eee8}
.order-card .order-item b{white-space:nowrap;color:#25241f}
.order-card .order-total{font-size:15px;color:#25241f;margin:7px 0}
.order-card .order-note{background:#f8f6f1;color:#6a665d;font-size:12px;overflow-wrap:anywhere}
.order-meta{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;color:#77736a;font-size:11px;margin-top:10px}
.order-actions{display:grid;grid-template-columns:1fr;gap:8px}
.order-actions button{width:100%;font-size:13px;padding:11px 12px;background:#ed683d;color:#fff}
.order-actions button.secondary{background:#f1efe9;color:#444139;border:1px solid #e6e2d8}
.order-actions button:disabled{opacity:.6}
.board-error{padding:14px 16px;background:#fff1e9;border:1px solid #f1d8cb;color:#8b3d24;border-radius:12px;overflow-wrap:anywhere}
@media(max-width:760px){.merchant-page{width:94%;margin-top:14px}.order-board{grid-template-columns:repeat(3,minmax(275px,84vw));gap:12px}.merchant-title{margin:18px 0}.merchant-title h1{letter-spacing:-1px}.topbar{align-items:flex-start}.topbar .row{justify-content:flex-end}}

/* MENIO merchant workspace — landscape-first, clean white POS board */
html,body{min-height:100%;background:#fff!important;color:#20201c}
body{background:#fff!important;overflow:hidden}
.merchant-page{width:100%;max-width:none;height:100dvh;min-height:0;margin:0;padding:14px 18px 16px;display:flex;flex-direction:column;gap:12px}
.merchant-page .topbar{flex:0 0 auto;margin:0;padding:0 0 12px;border-bottom:1px solid #ecebe7;display:grid;grid-template-columns:auto 1fr auto;gap:20px;align-items:center}
.merchant-page .topbar>.row{justify-content:center;gap:10px}
.merchant-page .topbar>.row:last-child{justify-content:flex-end}
.merchant-page .topbar .logo{font-size:24px;color:#20201c}
.merchant-page .topbar .live-dot{background:#24a66a;box-shadow:0 0 0 4px #24a66a18}
.merchant-page .topbar .row>span:nth-child(2){font-size:13px;font-weight:700;color:#65645e}
.merchant-page .topbar button,.merchant-page .topbar .btn{padding:9px 12px;font-size:12px;border-radius:10px}
.merchant-page .merchant-title{flex:0 0 auto;margin:0;align-items:center;gap:14px}
.merchant-page .merchant-title .eyebrow{margin:0 0 3px;color:#e75f35;font-size:9px;letter-spacing:1.5px}
.merchant-page .merchant-title h1{font-size:clamp(22px,2vw,30px);letter-spacing:-.7px;line-height:1.2;margin:0}
.merchant-page .merchant-title #status{font-size:11px;line-height:1.35;color:#77776e;margin:5px 0 0}
.merchant-page .board-summary{justify-content:flex-end}
.merchant-page .summary-chip{background:#f8f7f4;border:1px solid #eeece6;color:#65645e;border-radius:10px;padding:8px 11px;font-size:11px;font-weight:650}
.merchant-page .order-board{flex:1 1 auto;min-height:0;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;overflow:hidden;padding:0 0 2px;align-items:stretch}
.merchant-page .order-lane{display:flex;flex-direction:column;min-height:0;min-width:0;overflow:hidden;background:#f8f8f6;border:1px solid #ecebe7;border-radius:16px;padding:10px}
.merchant-page .lane-head{flex:0 0 auto;padding:5px 5px 11px}
.merchant-page .lane-title{font-size:14px;gap:9px;color:#262620}
.merchant-page .lane-dot{width:8px;height:8px;box-shadow:0 0 0 4px #e7a23c18}
.merchant-page .lane-count{background:#fff;border:1px solid #eeece6;color:#494840;min-width:27px;padding:4px 8px}
.merchant-page .lane-cards{flex:1 1 auto;min-height:0;overflow-y:auto;align-content:start;gap:9px;padding:0 2px 2px 0;scrollbar-width:thin;scrollbar-color:#d7d5ce transparent}
.merchant-page .board-empty{padding:24px 10px;background:#fff;border:1px dashed #e3e0d8;border-radius:12px;color:#99968c;font-size:11px}
.merchant-page .order-card{padding:12px!important;border:1px solid #e9e7e1!important;border-radius:13px!important;box-shadow:0 2px 8px #27241b06!important;min-width:0}
.merchant-page .order-head{gap:8px;margin-bottom:8px;align-items:center}
.merchant-page .order-head h2{font-size:15px;font-weight:850;letter-spacing:-.2px;line-height:1.25}
.merchant-page .order-card .status{font-size:9px;padding:5px 7px;border-radius:7px;white-space:nowrap;border:0}
.merchant-page .order-item{font-size:11px;line-height:1.35;padding:6px 0;gap:7px;border-color:#f0eee9}
.merchant-page .order-item span{overflow-wrap:anywhere;min-width:0}
.merchant-page .order-item b{font-size:10px}
.merchant-page .order-total{font-size:12px;margin:5px 0;padding:2px 0 5px}
.merchant-page .order-total strong{font-size:16px;color:#25241f}
.merchant-page .order-note{margin:7px 0 0;padding:8px 9px;border-radius:8px;background:#f7f5f0;color:#666258;font-size:10px;line-height:1.45}
.merchant-page .order-meta{font-size:9px;margin-top:8px;padding-top:7px;border-top:1px solid #f0eee9;color:#7d7a70}
.merchant-page .order-actions{grid-template-columns:1fr 1fr;gap:6px;margin-top:10px}
.merchant-page .order-actions button{min-width:0;padding:8px 7px;font-size:10px;line-height:1.3;border-radius:8px}
.merchant-page .order-actions button:first-child:last-child{grid-column:1/-1}
.merchant-page .order-actions button.secondary{background:#fff;color:#56544c;border-color:#e7e4dc}
.merchant-page .board-error{font-size:12px}
@media(orientation:portrait){
 body:after{content:"მერჩანტის სამუშაოდ გადააბრუნე მოწყობილობა ჰორიზონტალურად ↻";position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;text-align:center;padding:30px;background:#fff;color:#25241f;font-size:20px;font-weight:800;line-height:1.6}
}
@media(max-height:520px) and (orientation:landscape){
 .merchant-page{padding:8px 12px;gap:7px}
 .merchant-page .topbar{padding-bottom:7px}
 .merchant-page .merchant-title h1{font-size:21px}
 .merchant-page .order-lane{padding:7px}
 .merchant-page .order-card{padding:9px!important}
 .merchant-page .order-actions button{padding:6px}
}
</style>
</head>
<body>
<main class="merchant-page">
<header class="topbar">
<a class="logo" href="index.html">MENIO<span>.</span></a>
<div class="row"><span class="live-dot"></span><span>ცოცხალი შეკვეთები</span><button id="logout" class="secondary small-button">გასვლა</button></div>
<div class="row"><a id="reportLink" class="btn secondary small-button" href="report.html">ანგარიშგება</a><a id="backToDashboard" class="btn secondary small-button" href="register.html#login">მართვის პანელი</a></div>
</header>
<div class="merchant-title">
<div><p class="eyebrow">MENIO PARTNER · LIVE ORDERS</p><h1>შეკვეთების დაფა</h1><p id="status">შეკვეთებს ველოდები…</p></div>
<div class="board-summary"><span class="summary-chip">🔔 განახლება ავტომატურად</span></div>
</div>
<section id="orders" class="order-board" aria-label="შეკვეთების სტატუსები">
<div class="order-lane lane-incoming"><div class="lane-head"><div class="lane-title"><span class="lane-dot"></span>შემოსული</div><span class="lane-count">0</span></div><div class="lane-cards"></div></div>
<div class="order-lane lane-preparing"><div class="lane-head"><div class="lane-title"><span class="lane-dot"></span>მზადდება</div><span class="lane-count">0</span></div><div class="lane-cards"></div></div>
<div class="order-lane lane-ready"><div class="lane-head"><div class="lane-title"><span class="lane-dot"></span>მზადაა</div><span class="lane-count">0</span></div><div class="lane-cards"></div></div>
</section>
</main>
<script type="module" src="merchant.js?v=20261014-merchant-landscape-1"></script>
<script type="module">
const slug=new URLSearchParams(location.search).get("restaurant");
if(slug){document.getElementById("backToDashboard").href="dashboard.html?restaurant="+encodeURIComponent(slug);document.getElementById("reportLink").href="report.html?restaurant="+encodeURIComponent(slug);}
</script>
</body>
</html>
