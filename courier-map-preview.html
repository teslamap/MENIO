<!doctype html><html lang="ka"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f7f6f2"><title>ORDERA — კურიერის რუკა</title><link rel="stylesheet" href="style.css?v=20261014-ordera-brand-1"><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""><link rel="stylesheet" href="courier-map.css?v=20261015-pickup-2"><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin="" defer></script></head><body><main class="courier-shell"><div id="courierMap" aria-label="მიტანის ინტერაქტიული რუკა"></div><header class="courier-head"><div><a class="logo" href="index.html">ORDERA<span class="accent">.</span></a><span class="courier-label">კურიერი</span></div><div class="row"><span id="liveLabel">● დიზაინის დემო</span><button id="logout" class="secondary small-button" type="button">გასვლა</button></div></header><div class="map-controls"><button id="locateCourier" type="button" aria-label="ჩემი მდებარეობის ჩვენება">⌖ <span>ჩემი მდებარეობა</span></button><button id="fitOrders" type="button">ყველა წერტილი ↗</button></div><p id="mapMessage" class="map-message" role="status" aria-live="polite">რუკა იტვირთება…</p><section id="orderSheet" class="order-sheet" data-state="half" aria-label="შეკვეთების პანელი"><button id="sheetToggle" class="sheet-handle" type="button" aria-controls="sheetContent" aria-expanded="true" aria-label="შეკვეთების პანელის გაშლა ან ჩაკეცვა"><span class="handle-line"></span><span id="sheetToggleLabel">ჩაკეცვა</span></button><div class="sheet-heading"><div><p class="eyebrow">DELIVERY PARTNER</p><h1>შენი შეკვეთები <span id="orderCount">0</span></h1></div><span class="sheet-live">● პირდაპირ ეთერში</span></div><div id="status" class="courier-status" role="status" aria-live="polite">დემო შეკვეთები · რეალური მონაცემები არ გამოიყენება.</div><div id="sheetContent" class="sheet-content"><section id="courierOrders" class="courier-grid" aria-label="მიტანის შეკვეთები"></section><p class="fineprint">შეკვეთა აირჩიე დეტალების სანახავად. რუკაზე წერტილი ჩანს, როცა კოორდინატები ცნობილია ან შენ მონიშნავ მას.</p></div></section></main><script type="module">
import {mountCourierMap,navigationUrl} from './courier-map.js?v=20261015-pickup-2';
const mapUI=mountCourierMap();
const orders=[{id:'DEMO01',restaurantName:'რესტორანი · დემო',restaurantSlug:'demo-restaurant',restaurantLocation:{latitude:41.709,longitude:44.79},restaurantAddress:'რესტორნის საცდელი ლოკაცია',deliveryAddress:'რუსთაველის გამზირი · საცდელი მისამართი',deliveryLocation:{latitude:41.7043,longitude:44.7923},deliveryStatus:'waiting',total:28.5},{id:'DEMO02',restaurantName:'კაფე · დემო',deliveryAddress:'თავისუფლების მოედანი · საცდელი მისამართი',deliveryLocation:{latitude:41.6938,longitude:44.8015},deliveryStatus:'assigned',total:19}];
mapUI.updateOrders(orders);
for(const o of orders){const card=document.createElement('article');card.id='courier-order-'+o.id;card.className='courier-order';card.innerHTML='<div class="order-top"><h2>'+o.restaurantName+'</h2><span class="courier-tag">დემო შეკვეთა</span></div><p>'+o.deliveryAddress+'</p><div class="money">'+o.total.toFixed(2)+' ₾</div>';const b=document.createElement('button');b.type='button';b.className='order-map-button';b.textContent='რუკაზე ნახვა ⌖';b.onclick=()=>mapUI.focusOrder(o.id);card.append(b);document.getElementById('courierOrders').append(card);}
document.getElementById('logout').textContent='შესვლა';document.getElementById('logout').onclick=()=>location.href='courier-login.html';
</script></body></html>
