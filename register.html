<!doctype html><html lang="ka"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MENIO — რეგისტრაცია</title><link rel="stylesheet" href="style.css"></head><body><main class="panel"><a class="back" href="index.html">← MENIO</a><div class="logo">MENIO<span>.</span></div><h1 style="font-size:38px">რესტორნის რეგისტრაცია</h1><p>ანგარიში, რესტორნის გვერდი და მაგიდების QR-ები ერთ ნაბიჯში.</p><form id="registerForm"><label>რესტორნის სახელი</label><input id="restaurantName" required placeholder="დელიკატე"><label>უნიკალური ბმული (ლათინურად)</label><input id="restaurantSlug" pattern="[a-z0-9-]{3,40}" required placeholder="delicate"><small>მაგალითი: menio.ge/delicate</small><label>ელფოსტა</label><input id="email" type="email" required placeholder="you@example.com"><label>პაროლი (მინ. 8 სიმბოლო)</label><input id="password" type="password" minlength="8" required><label>მაგიდების რაოდენობა</label><input id="tableCount" type="number" min="1" max="200" value="10" required><label class="check-row"><input id="seedMenu" type="checkbox" checked> სატესტო მენიუს დამატება (8 კერძი)</label><button>რესტორნის შექმნა</button></form><div class="divider"></div><h2 id="login">უკვე გაქვს ანგარიში?</h2><form id="loginForm"><label>ელფოსტა</label><input id="loginEmail" type="email" required><label>პაროლი</label><input id="loginPassword" type="password" required><button class="secondary">შესვლა</button></form><p id="message" class="message"></p></main><script type="module" src="app.js"></script></body></html>
