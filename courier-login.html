<html lang="ka"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f7f6f2"><title>ORDERA — კურიერის შესვლა</title><link rel="stylesheet" href="style.css?v=20261014-ordera-brand-1"><style>
