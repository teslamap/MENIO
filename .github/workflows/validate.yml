name: MENIO static validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Check JavaScript module syntax
        shell: bash
        run: |
          set -euo pipefail
          for file in ./*.js; do
            echo "Checking $file"
            node --input-type=module --check < "$file"
          done
      - name: Test current published site pages
        run: node --test tests/site-smoke.test.mjs tests/courier.test.mjs tests/courier-registration.test.mjs tests/courier-login.test.mjs tests/courier-map.test.mjs tests/restaurant-settings.test.mjs
      - name: Check local assets and JavaScript module exports
        run: python tests/check-assets.py
      - name: Ensure Firebase config has no placeholders
        run: |
          ! grep -Eq 'YOUR_API_KEY|YOUR_PROJECT_ID|YOUR_PROJECT\.firebaseapp\.com' firebase.js
      - name: Validate Firestore rules with the emulator
        run: |
          npm install --global firebase-tools
          firebase emulators:exec --only firestore --project demo-menio --non-interactive "echo Firestore rules compiled successfully"
